<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reaction Timer - Learn RxJS Epics</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0f23 0%, #1a1a3e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
        }
        .game-container {
            text-align: center;
            padding: 40px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            max-width: 500px;
        }
        h1 {
            font-size: 2rem;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #ff6b6b, #feca57);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .subtitle {
            color: #888;
            margin-bottom: 30px;
        }
        .game-area {
            height: 200px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 20px 0;
            position: relative;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .game-area.waiting {
            border: 2px dashed #666;
        }
        .game-area.ready {
            border: 2px solid #00ff88;
            background: rgba(0, 255, 136, 0.1);
        }
        .game-area.too-early {
            border: 2px solid #ff6b6b;
            background: rgba(255, 107, 107, 0.2);
        }
        .shape {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #00ff88, #00d9ff);
            border-radius: 50%;
            animation: pulse 0.5s ease-in-out infinite alternate;
            display: none;
        }
        .shape.visible {
            display: block;
        }
        @keyframes pulse {
            from { transform: scale(1); }
            to { transform: scale(1.1); }
        }
        .message {
            font-size: 1.2rem;
            color: #888;
            min-height: 30px;
        }
        .stats {
            display: flex;
            justify-content: space-around;
            margin-top: 20px;
            padding: 20px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 10px;
        }
        .stat {
            text-align: center;
        }
        .stat-value {
            font-size: 1.5rem;
            font-weight: bold;
            color: #00d9ff;
        }
        .stat-label {
            font-size: 0.8rem;
            color: #666;
            text-transform: uppercase;
        }
        .start-btn {
            background: linear-gradient(135deg, #ff6b6b 0%, #feca57 100%);
            border: none;
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            color: #fff;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 20px;
        }
        .start-btn:hover {
            transform: scale(1.05);
        }
        .start-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>⚡ Reaction Timer</h1>
        <p class="subtitle">Learn RxJS Timers & delay - Project 2</p>
        
        <div class="game-area waiting" id="gameArea">
            <div class="message" id="message">Click "Start Game" to begin</div>
            <div class="shape" id="shape"></div>
        </div>
        
        <button class="start-btn" id="startBtn">Start Game</button>
        
        <div class="stats">
            <div class="stat">
                <div class="stat-value" id="lastTime">--</div>
                <div class="stat-label">Last Time (ms)</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="bestTime">--</div>
                <div class="stat-label">Best Time (ms)</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="attempts">0</div>
                <div class="stat-label">Attempts</div>
            </div>
        </div>
    </div>

    <script src="game.js" type="module"></script>
</body>
</html>
