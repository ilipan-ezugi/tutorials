<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game - Learn RxJS Epics</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Courier New', monospace;
            background: #0d0d0d;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
        }
        .game-container {
            text-align: center;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: #00ff88;
            text-shadow: 0 0 20px rgba(0, 255, 136, 0.5);
        }
        .subtitle {
            color: #666;
            margin-bottom: 20px;
        }
        .game-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            padding: 10px 20px;
            background: rgba(0, 255, 136, 0.1);
            border-radius: 5px;
        }
        .info-item {
            font-size: 1.2rem;
        }
        .info-item span {
            color: #00ff88;
            font-weight: bold;
        }
        #gameCanvas {
            border: 2px solid #00ff88;
            border-radius: 5px;
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.3);
        }
        .controls {
            margin-top: 20px;
            color: #666;
            font-size: 0.9rem;
        }
        .game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            padding: 40px;
            border-radius: 10px;
            text-align: center;
            display: none;
        }
        .game-over h2 {
            color: #ff6b6b;
            font-size: 2rem;
            margin-bottom: 20px;
        }
        .restart-btn {
            background: #00ff88;
            border: none;
            padding: 15px 30px;
            font-size: 1.2rem;
            font-weight: bold;
            color: #0d0d0d;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .restart-btn:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>🐍 Snake</h1>
        <p class="subtitle">Learn RxJS fromEvent & Game Loop - Project 3</p>
        
        <div class="game-info">
            <div class="info-item">Score: <span id="score">0</span></div>
            <div class="info-item">Best: <span id="bestScore">0</span></div>
        </div>
        
        <canvas id="gameCanvas" width="400" height="400"></canvas>
        
        <div class="controls">
            Use <strong>Arrow Keys</strong> to move | <strong>Space</strong> to pause
        </div>
        
        <div class="game-over" id="gameOver">
            <h2>Game Over!</h2>
            <p>Final Score: <span id="finalScore">0</span></p>
            <br>
            <button class="restart-btn" id="restartBtn">Play Again</button>
        </div>
    </div>

    <script src="game.js" type="module"></script>
</body>
</html>
